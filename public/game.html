<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon 3D</title>
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #000; overflow: hidden; }
        #game { width: 100vw; height: 100vh; }
        #loading {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a2e;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-size: 18px;
            z-index: 1000;
        }
        #loading.hidden { display: none; }
        #hud {
            position: fixed; top: 10px; left: 10px;
            color: white; font-size: 13px;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px; border-radius: 8px;
        }
        #controls {
            position: fixed; bottom: 10px; left: 10px;
            color: white; font-size: 12px;
            background: rgba(0,0,0,0.6);
            padding: 10px; border-radius: 8px;
        }
        kbd { background: #333; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="game"></div>
    <div id="loading">Carregando...</div>
    <div id="hud">
        <div id="fps">FPS: --</div>
        <div id="pos">Pos: 0, 0</div>
    </div>
    <div id="controls">
        <kbd>WASD</kbd> Mover | <kbd>Mouse</kbd> Olhar | <kbd>Space</kbd> Pular | <kbd>Shift</kbd> Correr
    </div>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        const state = { moveForward: false, moveBackward: false, moveLeft: false, moveRight: false, canJump: true, sprint: false, velocity: new THREE.Vector3() };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 50, 300);

        const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('game').appendChild(renderer.domElement);

        const controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
        document.getElementById('game').onclick = () => controls.lock();

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(100, 150, 50);
        sun.castShadow = true;
        scene.add(sun);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(500, 500),
            new THREE.MeshStandardMaterial({ color: 0x4a7c23 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const loader = new OBJLoader();

        loader.load('/assets/maps/skyland_main.obj', (obj) => {
            obj.traverse(c => {
                if (c.isMesh) {
                    c.material = new THREE.MeshStandardMaterial({ color: 0x88aa66, flatShading: true });
                    c.castShadow = true;
                    c.receiveShadow = true;
                }
            });
            obj.scale.setScalar(0.1);
            scene.add(obj);
            document.getElementById('loading').classList.add('hidden');
        }, null, () => document.getElementById('loading').classList.add('hidden'));

        const buildings = [
            ['SM_C_001_PokeCen_01.obj', 10, -20, 0xff6b6b],
            ['SM_C_001_Gym_01.obj', -15, -20, 0x666666],
            ['SM_C_001_Shop_01.obj', 25, -15, 0x4169e1],
            ['Laboratory_01.obj', 0, -40, 0xd2691e]
        ];

        buildings.forEach(([file, x, z, color]) => {
            loader.load('/assets/maps/' + file, (obj) => {
                obj.traverse(c => {
                    if (c.isMesh) c.material = new THREE.MeshStandardMaterial({ color });
                });
                obj.scale.setScalar(0.5);
                obj.position.set(x, 0, z);
                scene.add(obj);
            });
        });

        [[5,5,0xffff00], [-5,8,0xff6600], [12,-5,0x00ff00], [-8,-10,0x0066ff], [0,15,0xff00ff]].forEach(([x,z,c]) => {
            const p = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshStandardMaterial({color:c}));
            p.position.set(x, 1, z);
            scene.add(p);
        });

        document.addEventListener('keydown', e => {
            if (e.code === 'KeyW') state.moveForward = true;
            if (e.code === 'KeyS') state.moveBackward = true;
            if (e.code === 'KeyA') state.moveLeft = true;
            if (e.code === 'KeyD') state.moveRight = true;
            if (e.code === 'Space' && state.canJump) { state.velocity.y = 10; state.canJump = false; }
            if (e.code === 'ShiftLeft') state.sprint = true;
        });

        document.addEventListener('keyup', e => {
            if (e.code === 'KeyW') state.moveForward = false;
            if (e.code === 'KeyS') state.moveBackward = false;
            if (e.code === 'KeyA') state.moveLeft = false;
            if (e.code === 'KeyD') state.moveRight = false;
            if (e.code === 'ShiftLeft') state.sprint = false;
        });

        let prev = performance.now(), frames = 0, lastFps = 0;

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now(), dt = (now - prev) / 1000;
            prev = now;

            frames++;
            if (now - lastFps > 1000) { document.getElementById('fps').textContent = 'FPS: ' + frames; frames = 0; lastFps = now; }

            if (controls.isLocked) {
                const speed = state.sprint ? 40 : 20;
                state.velocity.x *= 0.9; state.velocity.z *= 0.9;
                state.velocity.y -= 25 * dt;

                if (state.moveForward) state.velocity.z -= speed * dt;
                if (state.moveBackward) state.velocity.z += speed * dt;
                if (state.moveLeft) state.velocity.x -= speed * dt;
                if (state.moveRight) state.velocity.x += speed * dt;

                controls.moveRight(state.velocity.x);
                controls.moveForward(-state.velocity.z);
                controls.getObject().position.y += state.velocity.y * dt;

                if (controls.getObject().position.y < 2) {
                    state.velocity.y = 0;
                    controls.getObject().position.y = 2;
                    state.canJump = true;
                }

                const p = controls.getObject().position;
                document.getElementById('pos').textContent = 'Pos: ' + p.x.toFixed(0) + ', ' + p.z.toFixed(0);
            }

            renderer.render(scene, camera);
        }
        animate();

        onresize = () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); };
    </script>
</body>
</html>
