<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon 3D - Editor de Mapas</title>
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; overflow: hidden; }
        #canvas-container { width: 100vw; height: 100vh; }
        #info {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 13px;
        }
        #info kbd { background: #333; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info">
        <b>Pallet Town</b> | <kbd>Mouse</kbd> Rotacionar | <kbd>Scroll</kbd> Zoom
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0xe8f4f8, 50, 200);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(40, 30, 40);
        camera.lookAt(0, 0, 0);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 0.8);
        sun.position.set(50, 100, 50);
        sun.castShadow = true;
        scene.add(sun);

        // Load map
        const response = await fetch('/maps/pallet_town.json');
        const map = await response.json();
        console.log('Loading map:', map.name, 'with', map.objects.length, 'objects');

        for (const obj of map.objects) {
            let geo;
            switch (obj.primitive) {
                case 'plane': geo = new THREE.PlaneGeometry(1, 1); break;
                case 'box': geo = new THREE.BoxGeometry(1, 1, 1); break;
                case 'cylinder': geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 32); break;
                default: geo = new THREE.BoxGeometry(1, 1, 1);
            }

            const mat = new THREE.MeshStandardMaterial({
                color: obj.material?.color || '#888888',
                transparent: obj.material?.opacity !== undefined,
                opacity: obj.material?.opacity ?? 1,
                roughness: 0.7
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            if (obj.position) mesh.position.set(obj.position.x || 0, obj.position.y || 0, obj.position.z || 0);
            if (obj.rotation) mesh.rotation.set(
                (obj.rotation.x || 0) * Math.PI / 180,
                (obj.rotation.y || 0) * Math.PI / 180,
                (obj.rotation.z || 0) * Math.PI / 180
            );
            if (obj.scale) mesh.scale.set(obj.scale.x || 1, obj.scale.y || 1, obj.scale.z || 1);

            scene.add(mesh);
            console.log('Added:', obj.name, 'at', obj.position);
        }

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        console.log('Map loaded successfully!');
    </script>
</body>
</html>
